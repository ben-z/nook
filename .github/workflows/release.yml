name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nook-macos-26
          path: dist
      - name: Verify version, source commit and downloaded checksums
        working-directory: dist
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          assert release['tag'] == os.environ['RELEASE_TAG'], 'The tag does not match VERSION'
          assert release['commit'] == os.environ['RELEASE_COMMIT'], 'The artifacts came from a different commit'
          PY
          sha256sum --check SHA256SUMS.txt
      - name: Publish experimental prerelease
        run: |
          gh release create "$RELEASE_TAG" dist/Nook-*.zip dist/SHA256SUMS.txt dist/release.json \
            --verify-tag --prerelease --latest=false --title "Nook $RELEASE_TAG" \
            --notes-file dist/release-notes.md --generate-notes
